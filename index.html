        // primo avvio: non esiste ancora nessun dato remoto sul database condiviso.
        // Se abbiamo dati iniziali incorporati nella pagina (dal vecchio artefatto)
        // e non ci sono ancora dati locali, li usiamo come semina una tantum.
        if(!seeded && Object.keys(data).length === 0){
          var iniz = document.getElementById('dati-iniziali');
          if(iniz && iniz.textContent){
            try{
              var parsedIniz = JSON.parse(iniz.textContent);
              if(parsedIniz && typeof parsedIniz === 'object' && Object.keys(parsedIniz).length){
                data = parsedIniz;
                renderCalendar();
                seeded = true;
                persist();
              }
            }catch(e){ /* ignore */ }
          }
        }
        if(saveState === 'idle'){ saveState = 'ok'; updateSaveStatus(); }
        return;
      }
      if(saveState === 'idle'){ saveState = 'error'; updateSaveStatus(); }
    });
  }

  var pollTimer = null;
  function initStorage(){
    renderCalendar();
    caricaRemoto();
    pollTimer = setInterval(function(){
      // non ricarichiamo da remoto se ci sono modifiche locali non ancora salvate,
      // per non perdere quello che si sta scrivendo
      if(pendingSave || saveState === 'pending') return;
      if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
      caricaRemoto();
    }, 6000);
  }

  function classicDownload(filename, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function saveFile(filename, blob){
    classicDownload(filename, blob);
    return Promise.resolve();
  }

  var today = new Date();
  var current = { y: today.getFullYear(), m: today.getMonth() };

  var monthNames = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var dowShort = ['dom','lun','mar','mer','gio','ven','sab'];

  var listEl = document.getElementById('list');
  var monthLabelEl = document.getElementById('monthLabel');
  statusEl = document.getElementById('saveStatus');
  badgeEl = document.getElementById('saveBadge');
  badgeTextEl = document.getElementById('saveBadgeText');
  syncDotEl = document.getElementById('syncDot');

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateStr(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }

  function formatTimeInput(raw){
    var digits = raw.replace(/[^0-9]/g,'').slice(0,4);
    if(digits.length >= 3){
      return digits.slice(0,2) + ':' + digits.slice(2);
    }
    return digits;
  }

  function finalizeTime(raw){
    var digits = raw.replace(/[^0-9]/g,'').slice(0,4);
    if(digits.length === 0) return '';
    if(digits.length <= 2){
      var hh0 = digits.length === 1 ? '0'+digits : digits;
      return hh0 + ':00';
    }
    var hh = digits.slice(0,2);
    var mm = digits.slice(2);
    if(mm.length === 1) mm = '0'+mm;
    return hh + ':' + mm;
  }

  function minutesFromTime(t){
    if(!t) return null;
    var m = /^([0-9]{1,2}):([0-9]{2})$/.exec(t.trim());
    if(!m) return null;
    var hh = parseInt(m[1],10), mm = parseInt(m[2],10);
    if(isNaN(hh) || isNaN(mm) || hh>23 || mm>59) return null;
    return hh*60 + mm;
  }

  function orarioMinutes(inizio, fine){
    var a = minutesFromTime(inizio), b = minutesFromTime(fine);
    if(a===null || b===null) return 0;
    var diff = b - a;
    if(diff < 0) diff += 24*60;
    return diff;
  }

  function hasTotale(entry){
    if(!entry) return false;
    var v = parseFloat((entry.oreTotali||'').toString().replace(',','.'));
    return !isNaN(v) && v>0;
  }
  function hasOrario(entry){
    return !!(entry && minutesFromTime(entry.inizio)!==null && minutesFromTime(entry.fine)!==null);
  }

  function entryMinutes(entry){
    if(!entry) return 0;
    if(hasTotale(entry)){
      var v = parseFloat(entry.oreTotali.toString().replace(',','.'));
      return Math.round(v*60);
    }
    return orarioMinutes(entry.inizio, entry.fine);
  }

  function formatDec(mins){
    return (mins/60).toFixed(1).replace('.', ',');
  }

  function ensureEntry(ds){
    if(!data[ds]) data[ds] = { tipo:null, inizio:'', fine:'', oreTotali:'' };
    return data[ds];
  }

  function cleanupEntry(ds){
    var e = data[ds];
    if(!e) return;
    var hasAnyOrario = !!(e.inizio || e.fine);
    if(!e.tipo && !hasTotale(e) && !hasAnyOrario){ delete data[ds]; }
  }

  function renderCalendar(){
    var y = current.y, m = current.m;
    monthLabelEl.textContent = monthNames[m] + ' ' + y;
    listEl.innerHTML = '';

    var daysInMonth = new Date(y, m+1, 0).getDate();

    for(var d=1; d<=daysInMonth; d++){
      listEl.appendChild(buildRow(y, m, d));
    }
    renderSummary();
  }

  function buildRow(y, m, d){
    var ds = dateStr(y,m,d);
    var dow = new Date(y,m,d).getDay();
    var isToday = (y===today.getFullYear() && m===today.getMonth() && d===today.getDate());

    var row = document.createElement('div');
    row.className = 'row' + (isToday ? ' is-today' : '');
    row.dataset.ds = ds;

    var dateEl = document.createElement('div');
    dateEl.className = 'date';
    dateEl.innerHTML = '<span class="dow">'+dowShort[dow]+'</span><span class="num">'+pad(d)+'</span>';
    row.appendChild(dateEl);

    var mid = document.createElement('div');
    mid.className = 'mid';

    var editLine = document.createElement('div');
    editLine.className = 'edit-line';

    var editTop = document.createElement('div');
    editTop.className = 'edit-top';

    var ferieLabel = document.createElement('label');
    ferieLabel.className = 'status-chk ferie-chk';
    ferieLabel.innerHTML = '<input type="checkbox" class="ferieBox"> Ferie';
    editTop.appendChild(ferieLabel);

    var offLabel = document.createElement('label');
    offLabel.className = 'status-chk off-chk';
    offLabel.innerHTML = '<input type="checkbox" class="offBox"> Off';
    editTop.appendChild(offLabel);

    var mattinaLabel = document.createElement('label');
    mattinaLabel.className = 'status-chk mattina-chk';
    mattinaLabel.innerHTML = '<input type="checkbox" class="mattinaBox"> Mattina';
    editTop.appendChild(mattinaLabel);

    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = '✕';
    editTop.appendChild(clearBtn);

    editLine.appendChild(editTop);

    var editBottom = document.createElement('div');
    editBottom.className = 'edit-bottom';

    var inputsWrap = document.createElement('div');
    inputsWrap.className = 'inputs';

    var t1 = document.createElement('input');
    t1.type = 'text'; t1.className = 'time-input'; t1.inputMode = 'numeric';
    t1.placeholder = '00:00'; t1.maxLength = 5; t1.autocomplete = 'off';
    var sep = document.createElement('span');
    sep.className = 'sep'; sep.textContent = '–';
    var t2 = document.createElement('input');
    t2.type = 'text'; t2.className = 'time-input'; t2.inputMode = 'numeric';
    t2.placeholder = '00:00'; t2.maxLength = 5; t2.autocomplete = 'off';

    var orSep = document.createElement('span');
    orSep.className = 'or-sep'; orSep.textContent = 'o';

    var num = document.createElement('input');
    num.type = 'text'; num.className = 'ore-input'; num.inputMode = 'decimal';
    num.placeholder = '0'; num.autocomplete = 'off';
    var unit = document.createElement('span');
    unit.className = 'unit'; unit.textContent = 'h';

    var timeGroup = document.createElement('div');
    timeGroup.className = 'time-group';
    timeGroup.appendChild(t1); timeGroup.appendChild(sep); timeGroup.appendChild(t2);

    var oreGroup = document.createElement('div');
    oreGroup.className = 'ore-group';
    oreGroup.appendChild(num); oreGroup.appendChild(unit);

    inputsWrap.appendChild(timeGroup);
    inputsWrap.appendChild(orSep);
    inputsWrap.appendChild(oreGroup);
    editBottom.appendChild(inputsWrap);
    editLine.appendChild(editBottom);

    mid.appendChild(editLine);

    var staticLine = document.createElement('div');
    staticLine.className = 'static-line';
    mid.appendChild(staticLine);

    row.appendChild(mid);

    var resultEl = document.createElement('div');
    resultEl.className = 'result';
    row.appendChild(resultEl);

    function currentEntry(){ return data[ds]; }

    function refreshRow(){
      var e = currentEntry();
      var mins = entryMinutes(e);
      var tipo = e ? e.tipo : null;
      var totaleAttivo = hasTotale(e);
      var orarioAttivo = hasOrario(e);
      var isOff = (tipo === 'off');

      row.classList.toggle('has-ferie', tipo==='ferie');
      row.classList.toggle('has-off', tipo==='off');
      row.classList.toggle('has-mattina', tipo==='mattina');
      row.classList.toggle('has-lavorato', !tipo && mins>0);

      ferieLabel.querySelector('input').checked = (tipo==='ferie');
      offLabel.querySelector('input').checked = (tipo==='off');
      mattinaLabel.querySelector('input').checked = (tipo==='mattina');

      t1.value = (e && e.inizio) ? e.inizio : '';
      t2.value = (e && e.fine) ? e.fine : '';
      num.value = (e && e.oreTotali) ? e.oreTotali : '';

      var oreDisattivate = isOff || orarioAttivo || (e && (e.inizio || e.fine));
      var orarioDisattivato = isOff || totaleAttivo;
      t1.disabled = orarioDisattivato;
      t2.disabled = orarioDisattivato;
      timeGroup.classList.toggle('is-disabled', orarioDisattivato);
      num.disabled = !!oreDisattivate;
      oreGroup.classList.toggle('is-disabled', !!oreDisattivate);

      resultEl.textContent = isOff ? '0,0 h' : (mins>0 ? (formatDec(mins)+' h') : '—');

      var orarioTesto = (e && (e.inizio||e.fine)) ? (e.inizio||'—')+'–'+(e.fine||'—') : '';
      var dettaglio = isOff ? '' : (totaleAttivo ? formatDec(mins)+' h' : orarioTesto);
      var tagLabel = tipo==='ferie' ? 'Ferie' : (tipo==='off' ? 'Off' : (tipo==='mattina' ? 'Mattina' : ''));

      if(tipo && !dettaglio){
        staticLine.innerHTML = '<span class="tag tag-'+tipo+'">'+tagLabel+'</span>';
      } else if(tipo && dettaglio){
        staticLine.innerHTML = '<span class="tag tag-'+tipo+'">'+tagLabel+'</span> <span class="muted">·</span> '+dettaglio;
      } else if(dettaglio){
        staticLine.textContent = dettaglio;
      } else {
        staticLine.innerHTML = '<span class="muted">—</span>';
      }
    }

    function setTipo(nuovo){
      var en = ensureEntry(ds);
      en.tipo = nuovo;
      if(nuovo === 'off'){
        en.inizio = ''; en.fine = ''; en.oreTotali = '';
      }
      cleanupEntry(ds);
      persist(); refreshRow(); updateSummary();
    }

    ferieLabel.querySelector('input').addEventListener('change', function(){
      setTipo(this.checked ? 'ferie' : null);
    });
    offLabel.querySelector('input').addEventListener('change', function(){
      setTipo(this.checked ? 'off' : null);
    });
    mattinaLabel.querySelector('input').addEventListener('change', function(){
      setTipo(this.checked ? 'mattina' : null);
    });

    t1.addEventListener('input', function(){
      t1.value = formatTimeInput(t1.value);
      var en = ensureEntry(ds); en.inizio = t1.value;
      persist();
    });
    t2.addEventListener('input', function(){
      t2.value = formatTimeInput(t2.value);
      var en = ensureEntry(ds); en.fine = t2.value;
      persist();
    });
    function finalizeT1(){
      var en = ensureEntry(ds); en.inizio = finalizeTime(t1.value);
      cleanupEntry(ds); persist(); refreshRow(); updateSummary();
    }
    function finalizeT2(){
      var en = ensureEntry(ds); en.fine = finalizeTime(t2.value);
      cleanupEntry(ds); persist(); refreshRow(); updateSummary();
    }
    t1.addEventListener('change', finalizeT1);
    t1.addEventListener('blur', finalizeT1);
    t2.addEventListener('change', finalizeT2);
    t2.addEventListener('blur', finalizeT2);
    num.addEventListener('input', function(){
      num.value = num.value.replace(/[^0-9.,]/g,'');
      var en = ensureEntry(ds); en.oreTotali = num.value;
      var attivo = num.value !== '';
      t1.disabled = attivo; t2.disabled = attivo;
      timeGroup.classList.toggle('is-disabled', attivo);
      resultEl.textContent = (entryMinutes(en)>0) ? (formatDec(entryMinutes(en))+' h') : '—';
      persist(); updateSummary();
    });
    num.addEventListener('change', function(){
      cleanupEntry(ds); persist(); refreshRow(); updateSummary();
    });

    clearBtn.addEventListener('click', function(){
      delete data[ds];
      persist(); refreshRow(); updateSummary();
    });

    refreshRow();
    return row;
  }

  function monthTotals(y, m){
    var lavMins = 0, ferieMins = 0, giorniFerie = 0, giorniOff = 0, giorniMattina = 0;
    Object.keys(data).forEach(function(ds){
      var parts = ds.split('-');
      if(parseInt(parts[0],10)===y && parseInt(parts[1],10)===m+1){
        var e = data[ds];
        var mins = entryMinutes(e);
        if(e.tipo === 'ferie'){
          giorniFerie++;
          ferieMins += mins;
        } else if(e.tipo === 'off'){
          giorniOff++;
        } else if(e.tipo === 'mattina'){
          giorniMattina++;
          lavMins += mins;
        } else {
          lavMins += mins;
        }
      }
    });
    return { lavMins:lavMins, ferieMins:ferieMins, giorniFerie:giorniFerie, giorniOff:giorniOff, giorniMattina:giorniMattina };
  }

  function updateSummary(){
    var t = monthTotals(current.y, current.m);
    document.getElementById('statTotale').textContent = formatDec(t.lavMins+t.ferieMins)+' h';
    document.getElementById('statLavorate').textContent = formatDec(t.lavMins)+' h';
    document.getElementById('statFerie').textContent = formatDec(t.ferieMins)+' h';
    document.getElementById('statGiorniFerie').textContent = t.giorniFerie;
    document.getElementById('statGiorniOff').textContent = t.giorniOff;
    document.getElementById('statGiorniMattina').textContent = t.giorniMattina;
  }
  function renderSummary(){ updateSummary(); }

  document.getElementById('prevMonth').addEventListener('click', function(){
    current.m--; if(current.m<0){ current.m=11; current.y--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    current.m++; if(current.m>11){ current.m=0; current.y++; }
    renderCalendar();
  });

  var monthViewEl = document.getElementById('monthView');
  var yearViewEl = document.getElementById('yearView');
  var yearLabelEl = document.getElementById('yearLabel');
  var yearTotalEl = document.getElementById('yearTotal');
  var yearTableEl = document.getElementById('yearTable');
  var currentYear = today.getFullYear();

  function setActiveBtn(id){
    ['btnEdit','btnSummary','btnYear'].forEach(function(bid){
      document.getElementById(bid).classList.toggle('active', bid===id);
    });
  }

  document.getElementById('btnEdit').addEventListener('click', function(){
    document.body.classList.remove('summary-mode');
    monthViewEl.style.display = '';
    yearViewEl.style.display = 'none';
    setActiveBtn('btnEdit');
  });
  document.getElementById('btnSummary').addEventListener('click', function(){
    document.body.classList.add('summary-mode');
    monthViewEl.style.display = '';
    yearViewEl.style.display = 'none';
    setActiveBtn('btnSummary');
  });
  document.getElementById('btnYear').addEventListener('click', function(){
    monthViewEl.style.display = 'none';
    yearViewEl.style.display = '';
    setActiveBtn('btnYear');
    renderYear();
  });

  document.getElementById('prevYear').addEventListener('click', function(){
    currentYear--; renderYear();
  });
  document.getElementById('nextYear').addEventListener('click', function(){
    currentYear++; renderYear();
  });

  function renderYear(){
    yearLabelEl.textContent = currentYear;
    var totLav = 0, totFerie = 0;
    var rows = '';
    for(var m=0; m<12; m++){
      var t = monthTotals(currentYear, m);
      totLav += t.lavMins; totFerie += t.ferieMins;
      var tot = t.lavMins + t.ferieMins;
      var isCurrent = (currentYear===today.getFullYear() && m===today.getMonth());
      var detailBits = [];
      if(t.giorniFerie>0) detailBits.push(t.giorniFerie+' gg ferie');
      if(t.giorniOff>0) detailBits.push(t.giorniOff+' off');
      if(t.giorniMattina>0) detailBits.push(t.giorniMattina+' mattina');
      rows += '<div class="year-row'+(isCurrent?' is-current-month':'')+(tot<=0?' is-empty':'')+'">' +
        '<div><div class="ym-name">'+monthNames[m]+'</div>' +
        (detailBits.length ? '<div class="ym-detail">'+detailBits.join(' · ')+'</div>' : '') +
        '</div>' +
        '<div class="ym-total">'+(tot>0?formatDec(tot)+' h':'—')+'</div>' +
      '</div>';
    }
    yearTableEl.innerHTML = rows;
    yearTotalEl.innerHTML = '<div class="num">'+formatDec(totLav+totFerie)+' h</div><div class="lbl">ore totali dell\'anno (lavorate: '+formatDec(totLav)+' h · ferie: '+formatDec(totFerie)+' h)</div>';
  }

  document.getElementById('exportPdf').addEventListener('click', function(){
    try{
      if(!window.jspdf || !window.jspdf.jsPDF){
        alert('Generazione PDF non disponibile (serve una connessione internet la prima volta).');
        return;
      }
      var y = current.y, m = current.m;
      var doc = new window.jspdf.jsPDF({ unit:'pt', format:'a4' });
      var pageW = doc.internal.pageSize.getWidth();
      var pageH = doc.internal.pageSize.getHeight();
      var marginL = 40, marginR = 40;
      var yPos = 50;

      doc.setFont('helvetica','bold'); doc.setFontSize(16);
      doc.text('Registro Ore', marginL, yPos);
      doc.setFont('helvetica','normal'); doc.setFontSize(12);
      doc.text(monthNames[m]+' '+y, marginL, yPos+18);
      yPos += 40;

      var lavMins=0, ferieMins=0, giorniFerie=0, giorniOff=0, giorniMattina=0;
      var daysInMonth = new Date(y, m+1, 0).getDate();
      for(var d=1; d<=daysInMonth; d++){
        var e = data[dateStr(y,m,d)];
        if(!e) continue;
        var mins = entryMinutes(e);
        if(e.tipo==='ferie'){ giorniFerie++; ferieMins+=mins; }
        else if(e.tipo==='off'){ giorniOff++; }
        else if(e.tipo==='mattina'){ giorniMattina++; lavMins+=mins; }
        else { lavMins+=mins; }
      }
      doc.setFontSize(11);
      doc.text('Totale ore: '+formatDec(lavMins+ferieMins)+' h    lavorate: '+formatDec(lavMins)+' h    ferie: '+formatDec(ferieMins)+' h ('+giorniFerie+' gg)    mattina: '+giorniMattina+' gg    off: '+giorniOff+' gg', marginL, yPos);
      yPos += 26;

      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text('Giorno', marginL, yPos);
      doc.text('Tipo', marginL+90, yPos);
      doc.text('Orario', marginL+180, yPos);
      doc.text('Ore', pageW-marginR-30, yPos);
      yPos += 6;
      doc.setDrawColor(180); doc.line(marginL, yPos, pageW-marginR, yPos);
      yPos += 14;
      doc.setFont('helvetica','normal');

      for(var d2=1; d2<=daysInMonth; d2++){
        if(yPos > pageH - 50){
          doc.addPage(); yPos = 50;
        }
        var ds2 = dateStr(y,m,d2);
        var ent = data[ds2];
        var dow2 = new Date(y,m,d2).getDay();
        var mins2 = entryMinutes(ent);
        var tipoLabel = !ent ? '' : (ent.tipo==='ferie'?'Ferie':(ent.tipo==='off'?'Off':(ent.tipo==='mattina'?'Mattina':(mins2>0?'Lavorato':''))));
        var orarioLabel = (ent && !hasTotale(ent) && hasOrario(ent)) ? (ent.inizio+'–'+ent.fine) : '';
        var oreLabel = mins2>0 ? formatDec(mins2)+' h' : '—';

        doc.text(dowShort[dow2]+' '+pad(d2), marginL, yPos);
        doc.text(tipoLabel||'—', marginL+90, yPos);
        doc.text(orarioLabel||'—', marginL+180, yPos);
        doc.text(oreLabel, pageW-marginR-30, yPos);
        yPos += 16;
      }

      var pdfBlob = doc.output('blob');
      saveFile('ore_'+monthNames[m]+'_'+y+'.pdf', pdfBlob);
    }catch(err){
      console.error('Errore esportazione PDF', err);
      alert('Non sono riuscito a generare il PDF.');
    }
  });

  document.getElementById('exportCsv').addEventListener('click', function(){
    var y = current.y, m = current.m;
    var rows = [['Data','Tipo','Orario','Ore']];
    var daysInMonth = new Date(y, m+1, 0).getDate();
    for(var d=1; d<=daysInMonth; d++){
      var ds = dateStr(y,m,d);
      var e = data[ds];
      if(!e) continue;
      var mins = entryMinutes(e);
      var orarioStr = (!hasTotale(e) && hasOrario(e)) ? ((e.inizio||'')+'-'+(e.fine||'')) : '';
      var tipoStr = e.tipo==='ferie' ? 'Ferie' : (e.tipo==='off' ? 'Off' : (e.tipo==='mattina' ? 'Mattina' : 'Lavorato'));
      rows.push([ds, tipoStr, orarioStr, mins>0 ? formatDec(mins) : '']);
    }
    var csv = rows.map(function(r){
      return r.map(function(cell){
        cell = (cell===undefined||cell===null) ? '' : String(cell);
        if(cell.indexOf(',')>-1 || cell.indexOf('"')>-1){ cell = '"'+cell.replace(/"/g,'""')+'"'; }
        return cell;
      }).join(',');
    }).join('\n');
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    saveFile('ore_'+monthNames[m]+'_'+y+'.csv', blob);
  });

  document.getElementById('exportBackup').addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json;charset=utf-8;'});
    saveFile('registro-ore-backup.json', blob);
  });

  document.getElementById('importBackup').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var parsed = JSON.parse(evt.target.result);
        if(typeof parsed !== 'object' || parsed === null) throw new Error('formato non valido');
        var sostituisci = confirm('Vuoi SOSTITUIRE tutti i dati attuali con quelli del backup? Annulla per unire i dati invece di sostituirli.');
        if(sostituisci){
          data = parsed;
        } else {
          Object.keys(parsed).forEach(function(ds){ data[ds] = parsed[ds]; });
        }
        persist();
        renderCalendar();
        alert('Backup caricato correttamente.');
      }catch(err){
        alert('Il file scelto non è un backup valido di Registro Ore.');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  initStorage();

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      commitActiveInput();
      flushPersistNow();
    }
  });
  window.addEventListener('pagehide', function(){
    commitActiveInput();
    flushPersistNow();
  });
  window.addEventListener('blur', function(){
    flushPersistNow();
  });
})();
</script></body></html>
